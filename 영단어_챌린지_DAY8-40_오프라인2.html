  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --pink: #ff4d8d;
    --pink-light: #ffb3d1;
    --purple: #a855f7;
    --blue: #3b82f6;
    --cyan: #06d6f0;
    --yellow: #fde047;
    --green: #22c55e;
    --red: #ef4444;
    --dark: #1e1b4b;
  }
  
  html, body {
    height: 100%;
    width: 100%;
    overflow-x: hidden;
    font-family: 'Jua', 'Fredoka', sans-serif;
    background: linear-gradient(135deg, #ff9ec7 0%, #c084fc 35%, #818cf8 70%, #06d6f0 100%);
    background-size: 400% 400%;
    animation: bgShift 15s ease infinite;
    color: white;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  
  body {
    /* iPhone 노치/홈인디케이터 영역 활용 */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    min-height: 100vh;
    min-height: 100dvh; /* 동적 뷰포트 - 사파리 주소창 고려 */
  }
  
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  
  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 12px 14px 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  
  /* 아이폰 mini (375px) 등 좁은 화면 대응 */
  @media (max-width: 400px) {
    #app { padding: 10px 12px 16px; }
    
    .title-card { padding: 15px 10px; margin-top: 0; }
    .title-card h1 { font-size: 2.4rem; }
    .title-card .subtitle { font-size: 1rem; }
    .title-card .day-badge { font-size: 0.95rem; padding: 6px 16px; }
    
    .btn { padding: 16px; margin: 10px 0; font-size: 1.2rem; }
    .btn .emoji { font-size: 1.6rem; margin-bottom: 2px; }
    
    .menu-info { padding: 10px; font-size: 0.85rem; margin: 10px 0; }
    
    /* DAY 그리드 - 4열로 더 컴팩트 */
    .day-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .day-card { padding: 10px 6px; }
    .day-card .day-num { font-size: 1.3rem; }
    .day-card .day-title { font-size: 0.7rem; height: 2.2em; }
    .day-card .best-score { font-size: 0.65rem; }
    
    .game-header { padding: 9px 10px; gap: 4px; }
    .stat .label { font-size: 0.65rem; }
    .stat .value { font-size: 1.15rem; }
    
    .question-card { padding: 22px 16px; margin-bottom: 14px; border-width: 3px; }
    .question-card .label { font-size: 0.85rem; }
    .question-word { font-size: 2rem; }
    .pronunciation { font-size: 0.95rem; margin-top: 5px; }

let audioCtx;
function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq, dur=0.1, type='sine', vol=0.2) {
  try {
    const ctx = getCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  } catch(e) {}
}

let autoSpeak = true;

if('speechSynthesis' in window){ loadVoices(); try{ window.speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} }
function speakWord(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.05;
    if(!_voices.length) loadVoices();
    const v = _voices.find(x=>/en[-_]US/i.test(x.lang)) || _voices.find(x=>/^en/i.test(x.lang));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// [2] 발음기호 → 한글 자동 변환 (읽기 보조용, 강세 음절 강조)
const J = {a:0,ae:1,ya:2,yae:3,eo:4,e:5,yeo:6,ye:7,o:8,wa:9,wae:10,oe:11,yo:12,u:13,weo:14,we:15,wi:16,yu:17,eu:18,ui:19,i:20};
const JONG = {none:0,k:1,n:4,l:8,m:16,b:17,s:19,ng:21};
const C=(cho,jung,jong)=>String.fromCharCode(0xAC00+(cho*21+jung)*28+jong);
const ONSET={p:17,b:7,t:16,d:3,k:15,g:0,f:17,v:7,'θ':9,'ð':3,s:9,z:12,h:18,'ʃ':9,'ʒ':12,'ʧ':14,'ʤ':12,m:6,n:2,'ŋ':11,l:5,r:5};
const VOW={i:'i','ɪ':'i',e:'e','ɛ':'e','æ':'ae','ɑ':'a',a:'a','ʌ':'eo','ə':'eo','ɔ':'o',o:'o',u:'u','ʊ':'u','ɜ':'eo','ɚ':'eo','ɝ':'eo'};
const YG={a:'ya',ae:'yae',eo:'yeo',e:'ye',o:'yo',u:'yu',eu:'i',i:'i'};
const WG={a:'wa',eo:'weo',e:'we',ae:'wae',i:'wi',o:'weo',u:'wi',eu:'weo'};
const CODA={m:'m',n:'n','ŋ':'ng',l:'l',p:'b',b:'b',t:'s',k:'k',g:'k'};
const TAIL={d:'드',f:'프',v:'브',s:'스',z:'즈','θ':'스','ð':'드','ʃ':'시','ʒ':'지','ʧ':'치','ʤ':'지'};
const CLUSTERS=new Set(['pr','pl','br','bl','tr','dr','kr','gr','kl','gl','fr','fl','sl','sm','sn','sp','st','sk','θr','ʃr','sf']);
const VSET=new Set(Object.keys(VOW));
const DIPH={'eɪ':['e','i'],'aɪ':['a','i'],'ɔɪ':['o','i'],'aʊ':['a','u']};
const MONO={'oʊ':'o'};
function ipaToKorean(ipa){
  if(!ipa) return '';
  try{
    let s=ipa.replace(/ː/g,'').replace(/ˌ/g,'').replace(/ˈ/g,'\u0001').replace(/[˺ʰ.\s]/g,'');
    const syl=[]; let pend=[]; let stress=false;
    const ch=Array.from(s); let i=0;
    const tail=(c,att)=>{
      if(CODA[c]!==undefined&&att&&syl.length&&syl[syl.length-1].jong===0&&!syl[syl.length-1].lit){ syl[syl.length-1].jong=JONG[CODA[c]]; }
      else if(TAIL[c]!==undefined){ syl.push({lit:TAIL[c]}); }
      else if(CODA[c]!==undefined){ syl.push({cho:ONSET[c]??11,v:'eu',jong:0,st:false}); }
    };
    const coda=(reg)=>{ const f=reg.filter(c=>c!=='r'); if(f.length){ tail(f[0],true); for(let k=1;k<f.length;k++) tail(f[k],false);} };
    const flush=(run,hasV)=>{
      if(!hasV){ coda(run); return null; }
      let glide=null,onset=null,last=run[run.length-1];
      if(last==='j'){ glide='y'; run.pop(); onset=run.length?run.pop():null; }
      else if(last==='w'){ const b=run[run.length-2]; run.pop(); glide='w'; onset=(b==='k'||b==='g')?run.pop():null; }
      else { onset=run.length?run.pop():null; }
      if(onset==='ʃ'&&!glide) glide='y';
      let cl=null;
      if(onset!==null&&run.length){ const cand=run[run.length-1]+onset; if(CLUSTERS.has(cand)) cl=run.pop(); }
      coda(run);
      if(cl!==null) tail(cl,false);
      return {onset,glide};
    };
    const push=(oi,v,st)=>{ let cho=(oi&&oi.onset!==null)?ONSET[oi.onset]:11; if(oi&&oi.glide==='y')v=YG[v]||v; if(oi&&oi.glide==='w')v=WG[v]||v; syl.push({cho,v,jong:0,st}); };
    while(i<ch.length){
      let c=ch[i];
      if(c==='\u0001'){ stress=true; i++; continue; }
      let two=c+(ch[i+1]||'');
      if(MONO[two]){ const oi=flush(pend,true); pend=[]; push(oi,VOW[MONO[two]],stress); stress=false; i+=2; continue; }
      if(DIPH[two]){ const oi=flush(pend,true); pend=[]; const [b,t]=DIPH[two]; push(oi,b,stress); stress=false; syl.push({cho:11,v:t,jong:0,st:false}); i+=2; continue; }
      if(VSET.has(c)){ const oi=flush(pend,true); pend=[]; push(oi,VOW[c],stress); stress=false; i++; continue; }
      pend.push(c); i++;
    }
    flush(pend,false);
    let out='';
    for(const x of syl){ let p=x.lit?x.lit:C(x.cho,(J[x.v]??18),x.jong); if(x.st)p='\u0002'+p+'\u0003'; out+=p; }
    return out;
  }catch(e){ return ''; }
}
// 발음 영역 HTML: 🔊버튼 + 한글읽기(강세 span) + 작은 발음기호
function pronInner(en, ipa){
  const safe = String(en).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  let html = `<button class="speak-btn" onclick="speakWord('${safe}')" aria-label="발음 듣기">🔊</button>`;
  if(ipa){
    const kor = ipaToKorean(ipa)
      .replace(/\u0002/g,'<span class="st">').replace(/\u0003/g,'</span>');
    if(kor) html += `<span class="kor-pron">${kor}</span>`;
    html += `<span class="ipa-small">/${ipa}/</span>`;
  }
  return html;
}

function showConfirm(message, onYes){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal-box">
    <div class="m-msg">${message}</div>
    <div class="m-btns">
      <button class="m-btn m-no">아니요</button>
      <button class="m-btn m-yes">네</button>
    </div></div>`;
  const close = ()=>{ try{ ov.remove(); }catch(e){} };
  ov.querySelector('.m-no').onclick = ()=>{ sndClick(); close(); };
  ov.querySelector('.m-yes').onclick = ()=>{ sndClick(); close(); if(onYes) onYes(); };
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  document.body.appendChild(ov);
}

  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  document.body.appendChild(t);
  setTimeout(()=>{ try{ t.remove(); }catch(e){} }, dur);
}

const LS = (function(){
  let ok = true;
  try{ const k='__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); }
  catch(e){ ok = false; }
  const mem = {};
  return {
    get(k){ try{ return ok ? window.localStorage.getItem(k) : (k in mem ? mem[k] : null); }catch(e){ return (k in mem ? mem[k] : null); } },
    set(k,v){ try{ if(ok) window.localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } }
  };
})();

    const card = document.createElement('button');
    card.className = 'day-card' + (cleared?' cleared':'');
    card.onclick = ()=>selectDay(d);
    card.innerHTML = `
      <div class="day-num">DAY ${d}</div>
      <div class="day-title">${info.title}</div>
      ${cleared ? `<div class="best-score">최고 ${bestScore}점</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

function renderStatsSummary() {
  const days = Object.keys(ALL_DAYS);
  let cleared = 0;
  let totalBest = 0;
  days.forEach(d => {
    const ranks = JSON.parse(LS.get(`ranking_${gameMode}_day${d}`)||'[]');
    if(ranks.length > 0) {
      cleared++;
      totalBest += Math.max(...ranks.map(r=>r.score));
    }
  });
  document.getElementById('stats-summary').innerHTML = `
    <div><div class="big">${cleared}/${days.length}</div><div>클리어 DAY</div></div>
    <div><div class="big">${totalBest}</div><div>총 최고점</div></div>
  `;
}

function selectDay(d) {
  selectedDay = d;
  const info = ALL_DAYS[d];
  document.getElementById('mode-day-num').textContent = `DAY ${d}`;
  document.getElementById('mode-day-title').textContent = info.title;
  showScreen('mode');
}

function setDirection(dir) {
  direction = dir;
  const words = ALL_DAYS[selectedDay].words.map(w=>({en: w[0], ko: w[1], ipa: w[2]}));
  questions = shuffle([...words]).map(w=>{
    let qDir = dir;
    if(dir==='mixed') qDir = Math.random()<0.5?'en2ko':'ko2en';
    return {...w, dir: qDir};
  });
  currentIdx = 0; score = 0; combo = 0; maxCombo = 0; correctCount = 0;
  
  if(gameMode==='quiz') {
    document.getElementById('quiz-day-num').textContent = selectedDay;
    showScreen('quiz'); 
    nextQuiz();
  } else {
    document.getElementById('typing-day-num').textContent = selectedDay;
    showScreen('typing'); 
    nextTyping();
  }
}

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ============ 퀴즈 (4지선다) ============
function nextQuiz() {
  if(currentIdx >= questions.length) { endGame(); return; }
  answered = false;
  const q = questions[currentIdx];
  
  document.getElementById('quiz-progress').textContent = `${currentIdx+1}/${questions.length}`;
  document.getElementById('quiz-score').textContent = score;
  document.getElementById('quiz-combo').textContent = combo;
  document.getElementById('quiz-progress-fill').style.width = ((currentIdx)/questions.length*100)+'%';
  document.getElementById('quiz-feedback').innerHTML = '';
  
  const wordEl = document.getElementById('quiz-word');
  const labelEl = document.getElementById('quiz-label');
  
  let questionText, correctAnswer;
  const pronEl = document.getElementById('quiz-pron');
  if(q.dir==='en2ko') {
    questionText = q.en;
    correctAnswer = q.ko;
    labelEl.textContent = '이 단어의 뜻은?';
    wordEl.classList.remove('korean');
    pronEl.innerHTML = pronInner(q.en, q.ipa);
    pronEl.style.display = 'flex';
    if(autoSpeak) setTimeout(()=>speakWord(q.en), 160);
  } else {
    questionText = q.ko;
    correctAnswer = q.en;
    labelEl.textContent = '영어 단어는?';
    wordEl.classList.add('korean');
    pronEl.style.display = 'none'; // 한→영일 때는 발음기호 숨김 (힌트가 되니까)
  }
  wordEl.textContent = questionText;
  
  // 같은 DAY 안에서만 오답 보기
  const dayWords = ALL_DAYS[selectedDay].words.map(w=>({en: w[0], ko: w[1]}));
  const others = dayWords.filter(w=>w.en!==q.en);
  const wrongs = shuffle(others).slice(0,3).map(w=>q.dir==='en2ko'?w.ko:w.en);
  const choices = shuffle([correctAnswer, ...wrongs]);
  
  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  choices.forEach((ch,i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="num">${i+1}</span><span>${ch}</span>`;
    btn.onclick = ()=>checkQuiz(btn, ch===correctAnswer, correctAnswer);
    choicesEl.appendChild(btn);
  });
}

function checkQuiz(btn, isCorrect, correctAnswer) {
  if(answered) return;
  answered = true;
  
  const q = questions[currentIdx];
  const allBtns = document.querySelectorAll('#quiz-choices .choice');
  
  if(isCorrect) {
    btn.classList.add('correct');
    combo++;
    if(combo>maxCombo) maxCombo = combo;
    correctCount++;
    const points = 10 + Math.min(combo-1, 10)*2;
    score += points;
    sndCorrect();
    
    const rect = btn.getBoundingClientRect();
    spawnParticles(rect.left+rect.width/2, rect.top+rect.height/2);
    
    if(combo>=3 && combo%3===0) {
      showCombo(`${combo} COMBO!`);
      sndCombo();
    }
    
    document.getElementById('quiz-feedback').innerHTML = `<span style="color:#fde047;">+${points}점! 🎉</span>`;
  } else {
    btn.classList.add('wrong');
    combo = 0;
    sndWrong();
    allBtns.forEach(b=>{
      if(b.textContent.includes(correctAnswer)) b.classList.add('correct');
    });
    // 정답이 영단어인 경우 발음(🔊+한글)도 표시
    let answerDisplay = correctAnswer;
    if(q.dir==='ko2en') {
      answerDisplay = `${correctAnswer}<span class="pron">${pronInner(correctAnswer, q.ipa)}</span>`;
      if(autoSpeak) setTimeout(()=>speakWord(correctAnswer), 200);
    }
    document.getElementById('quiz-feedback').innerHTML = 
      `<span style="color:#fff;">아쉬워요! 정답:</span><div class="correct-answer">${answerDisplay}</div>`;
  }
  
  document.getElementById('quiz-score').textContent = score;
  document.getElementById('quiz-combo').textContent = combo;
  
  allBtns.forEach(b=>b.style.pointerEvents='none');
  
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = currentIdx+1 >= questions.length ? '🏆 결과 보기' : '다음 문제 →';
  nextBtn.onclick = ()=>{ currentIdx++; nextQuiz(); };
  document.getElementById('quiz-feedback').appendChild(nextBtn);
}

// ============ 타이핑 게임 ============
function nextTyping() {
  if(currentIdx >= questions.length) { endGame(); return; }
  answered = false;
  hintUsed = false;
  retryUsed = false;
  const q = questions[currentIdx];
  
  document.getElementById('typing-progress').textContent = `${currentIdx+1}/${questions.length}`;
  document.getElementById('typing-score').textContent = score;
  document.getElementById('typing-combo').textContent = combo;
  document.getElementById('typing-progress-fill').style.width = ((currentIdx)/questions.length*100)+'%';
  document.getElementById('typing-feedback').innerHTML = '';
  document.getElementById('typing-hint').textContent = '';
  
  const wordEl = document.getElementById('typing-word');
  const labelEl = document.getElementById('typing-label');
  const input = document.getElementById('typing-input');
  
  const tPronEl = document.getElementById('typing-pron');
  if(q.dir==='en2ko') {
    wordEl.textContent = q.en;
    wordEl.classList.remove('korean');
    labelEl.textContent = '한글 뜻을 입력!';
    input.placeholder = '한글로 입력 (예: 인사하다)';
    tPronEl.innerHTML = pronInner(q.en, q.ipa);
    tPronEl.style.display = 'flex';
    if(autoSpeak) setTimeout(()=>speakWord(q.en), 160);
  } else {
    wordEl.textContent = q.ko;
    wordEl.classList.add('korean');
    labelEl.textContent = '영어 단어 입력!';
    input.placeholder = '영어로 입력...';
    tPronEl.style.display = 'none';
  }
  input.value = '';
  input.classList.remove('correct','wrong');
  input.disabled = false;
  setTimeout(()=>input.focus(), 100);
}

function checkTyping() {
  if(answered) return;
  const q = questions[currentIdx];
  const input = document.getElementById('typing-input');
  const userAns = input.value.trim().toLowerCase();
  if(!userAns) return;
  
  const correctAns = q.dir==='en2ko' ? q.ko : q.en;
  
  let isCorrect = false;
  if(q.dir==='en2ko') {
    const correctWords = correctAns.replace(/[\s,]+/g, '|').split('|').filter(x=>x);
    isCorrect = correctWords.some(cw => userAns.includes(cw.toLowerCase().trim()));
    if(!isCorrect) isCorrect = correctAns.toLowerCase().includes(userAns);
  } else {
    isCorrect = userAns === correctAns.toLowerCase();
  }
  
  if(isCorrect) {
    answered = true;
    input.disabled = true;
    input.classList.add('correct');
    combo++;
    if(combo>maxCombo) maxCombo = combo;
    correctCount++;
    let points = (hintUsed || retryUsed) ? 7 : 15;
    points += Math.min(combo-1, 10)*2;
    score += points;
    sndCorrect();
    
    const rect = input.getBoundingClientRect();
    spawnParticles(rect.left+rect.width/2, rect.top+rect.height/2);
    
    if(combo>=3 && combo%3===0) {
      showCombo(`${combo} COMBO!`);
      sndCombo();
    }
    
    let msg = `정답! +${points}점 🎉`;
    if(retryUsed) msg = `잘했어요! +${points}점 💪 (재도전 성공)`;
    document.getElementById('typing-feedback').innerHTML = `<span style="color:#fde047;">${msg}</span>`;
    
    document.getElementById('typing-score').textContent = score;
    document.getElementById('typing-combo').textContent = combo;
    
    const nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.textContent = currentIdx+1 >= questions.length ? '🏆 결과 보기' : '다음 문제 →';
    nextBtn.onclick = ()=>{ currentIdx++; nextTyping(); };
    document.getElementById('typing-feedback').appendChild(nextBtn);
  } else {
    if(!retryUsed) {
      retryUsed = true;
      input.classList.add('wrong');
      sndWrong();
      
      setTimeout(()=>{
        input.classList.remove('wrong');
        input.value = '';
        input.focus();
      }, 700);
      
      document.getElementById('typing-feedback').innerHTML = 
        `<span style="color:#fde047; font-size:1.15rem;">❤️ 한 번 더! 다시 도전해봐요!</span>`;
    } else {
      answered = true;
      input.disabled = true;
      input.classList.add('wrong');
      combo = 0;
      sndWrong();
      let ansDisp = correctAns;
      if(q.dir==='ko2en') {
        ansDisp = `${correctAns}<span class="pron">${pronInner(correctAns, q.ipa)}</span>`;
        if(autoSpeak) setTimeout(()=>speakWord(correctAns), 200);
      }
      document.getElementById('typing-feedback').innerHTML = 
        `<span style="color:#fff;">아쉬워요! 정답:</span><div class="correct-answer">${ansDisp}</div>`;
      
      document.getElementById('typing-combo').textContent = combo;
      
      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = currentIdx+1 >= questions.length ? '🏆 결과 보기' : '다음 문제 →';
      nextBtn.onclick = ()=>{ currentIdx++; nextTyping(); };
      document.getElementById('typing-feedback').appendChild(nextBtn);
    }
  }
}

function showHint() {
  if(answered) return;
  const q = questions[currentIdx];
  const ans = q.dir==='en2ko' ? q.ko : q.en;
  let hint = '';
  for(let ch of ans) {
    if(ch===' '||ch===','||ch==='~') hint += ch;
    else hint += (Math.random()<0.4 ? ch : '_');
  }
  if(ans.length>0) hint = ans[0] + hint.substring(1);
  document.getElementById('typing-hint').textContent = hint;
  hintUsed = true;
  sndClick();
}

function skipQuestion() {
  if(answered) return;
  answered = true;
  combo = 0;
  const q = questions[currentIdx];
  const correctAns = q.dir==='en2ko' ? q.ko : q.en;
  document.getElementById('typing-input').disabled = true;
  document.getElementById('typing-combo').textContent = combo;
  sndWrong();
  let ansDisp = correctAns;
  if(q.dir==='ko2en') {
    ansDisp = `${correctAns}<span class="pron">${pronInner(correctAns, q.ipa)}</span>`;
    if(autoSpeak) setTimeout(()=>speakWord(correctAns), 200);
  }
  document.getElementById('typing-feedback').innerHTML = 
    `<span style="color:#fff;">패스! 정답:</span><div class="correct-answer">${ansDisp}</div>`;
  
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = currentIdx+1 >= questions.length ? '🏆 결과 보기' : '다음 문제 →';
  nextBtn.onclick = ()=>{ currentIdx++; nextTyping(); };
  document.getElementById('typing-feedback').appendChild(nextBtn);
}

document.getElementById('typing-input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') { e.preventDefault(); checkTyping(); }
});

// ============ 결과 ============
function endGame() {
  sndFinish();
  const total = questions.length;
  const percent = (correctCount/total*100).toFixed(0);
  
  let trophy='🎉', title='수고했어요!', msg='';
  if(percent>=90) { trophy='🏆'; title='완벽해요!'; msg='최고의 영단어 마스터! 👑'; }
  else if(percent>=70) { trophy='🥇'; title='훌륭해요!'; msg='조금만 더 하면 마스터!'; }
  else if(percent>=50) { trophy='🥈'; title='잘했어요!'; msg='꾸준히 하면 더 잘할 수 있어요!'; }
  else { trophy='🥉'; title='도전 완료!'; msg='다시 한번 도전해봐요!'; }
  
  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-day-info').textContent = `DAY ${selectedDay} - ${ALL_DAYS[selectedDay].title}`;
  document.getElementById('result-message').textContent = msg + ` (${correctCount}/${total} 정답, ${percent}%)`;
  document.getElementById('result-score').textContent = score;
  document.getElementById('result-correct').textContent = `${correctCount}/${total}`;
  document.getElementById('result-combo').textContent = maxCombo;
  document.getElementById('player-name').value = LS.get('lastPlayerName')||'';
  
  showScreen('result');
}

// ============ 점수 저장 ============
function saveScore() {
  const name = document.getElementById('player-name').value.trim() || '익명';
  LS.set('lastPlayerName', name);
  
  const key = `ranking_${gameMode}_day${selectedDay}`;
  const ranks = JSON.parse(LS.get(key)||'[]');
  ranks.push({
    name, score, correct: correctCount, total: questions.length,
    combo: maxCombo, date: new Date().toISOString().split('T')[0]
  });
  ranks.sort((a,b)=>b.score-a.score);
  ranks.splice(10);
  LS.set(key, JSON.stringify(ranks));
  
  sndCorrect();
  spawnParticles(window.innerWidth/2, window.innerHeight/2, ['🏆','⭐','💖','🎉']);
  showToast('🎉 저장 완료! 랭킹에서 확인하세요!');
  showRanking();
}

// ============ 랭킹 ============
let currentRankTab = 'quiz';
function showRanking() {
  currentRankTab = 'quiz';
  document.querySelectorAll('.rank-tab button').forEach((b,i)=>{
    b.classList.toggle('active', i===0);
  });
  
  // DAY 선택 드롭다운 채우기
  const select = document.getElementById('rank-day-select');
  select.innerHTML = '';
  Object.keys(ALL_DAYS).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = `DAY ${d} - ${ALL_DAYS[d].title}`;
    select.appendChild(opt);
  });
  // 마지막에 플레이한 DAY 선택
  if(selectedDay) select.value = selectedDay;
  
  renderRanking();
  showScreen('ranking');
}

function switchRankTab(btn, mode) {
  document.querySelectorAll('.rank-tab button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentRankTab = mode;
  renderRanking();
  sndClick();
}

function renderRanking() {
  const day = document.getElementById('rank-day-select').value;
  const key = `ranking_${currentRankTab}_day${day}`;
  const ranks = JSON.parse(LS.get(key)||'[]');
  const list = document.getElementById('rank-list');
  
  if(ranks.length===0) {
    list.innerHTML = '<div class="rank-empty">아직 기록이 없어요!<br>첫 번째 도전자가 되어보세요 🚀</div>';
    return;
  }
  
  list.innerHTML = ranks.map((r,i)=>{
    let medal = '🏅';
    if(i===0) medal='🥇'; else if(i===1) medal='🥈'; else if(i===2) medal='🥉';
    else medal = `<span style="font-size:1rem;color:#888;">${i+1}</span>`;
    return `<div class="rank-item">
      <div class="rank-medal">${medal}</div>
      <div class="rank-name">${escapeHtml(r.name)}<div style="font-size:0.7rem;color:#888;font-weight:normal;">${r.correct}/${r.total} · 콤보${r.combo} · ${r.date}</div></div>
      <div class="rank-score">${r.score}점</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.addEventListener('click', ()=>{
  getCtx();
  // iOS Safari가 아닌 경우만 fullscreen API 사용 (iOS는 PWA 방식 권장)
  if(!/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    tryFullscreen();
  }
}, {once:true});

// PWA로 실행 안된 경우 iOS 사용자에게 홈 화면 추가 안내 (1회)
if(/iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone && !sessionStorage.getItem('pwa_hint')) {

    hint.innerHTML = '💡 <b>전체화면으로 즐기기</b><br>사파리 하단 <b>공유 ⬆️</b> → <b>홈 화면에 추가</b>를 누른 뒤,<br>홈 화면에서 아이콘으로 실행해주세요!<br><button onclick="this.parentElement.remove()" style="margin-top:10px;padding:6px 18px;background:#fde047;color:#333;border:none;border-radius:10px;font-weight:bold;font-family:inherit;">알겠어요!</button>';
    document.body.appendChild(hint);
  }, 1500);
